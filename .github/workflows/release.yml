name: release
on:
  push:
    tags: ["v*"]
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: notes
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          awk "/^## \[/{if (p) exit} /^## \[${TAG#v}?]/{p=1} p" CHANGELOG.md | head -n 40 > /tmp/notes.md
          [ -s /tmp/notes.md ] || echo "See CHANGELOG.md" > /tmp/notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/notes.md
